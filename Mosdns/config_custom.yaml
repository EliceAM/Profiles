log:
  level: info
  file: "/var/log/mosdns.log"
  
plugins:
  ################## 数据源 ##################

#  - tag: streaminglist
#    type: domain_set
#    args:
#      files:
#        - /etc/mosdns/rule/streaming.txt
        
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - /etc/mosdns/rule/whitelist.txt
        - /var/mosdns/geosite_tld-cn.txt
        - /var/mosdns/geosite_cn.txt
        - /var/mosdns/geosite_apple.txt
        - /var/mosdns/geosite_microsoft@cn.txt
        - /var/mosdns/geosite_category-games@cn.txt
        
  - tag: geosite_no_cn
    type: domain_set
    args:
      files:
        - /etc/mosdns/rule/greylist.txt
        - /var/mosdns/geosite_geolocation-!cn.txt
  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - /var/mosdns/geoip_cn.txt
 
  ################## 逻辑执行序列 ##################

  #纯净国内转发 (SmartDNS)
  - tag: local_forward
    type: sequence
    args:
      - exec: forward udp://192.168.10.3:6353
      - exec: ttl 5-5

  #Clash 转发 (Fake-IP)
  - tag: clash_forward
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: forward udp://127.0.0.1:7874
      - exec: ttl 1-1

  # fallback的primary服务器, 返回国内ip则accept, 返回非国内ip则drop
  - tag: local_sequence
    type: sequence
    args:
      - exec: $local_forward
      - matches: resp_ip $geoip_cn
        exec: accept
      - exec: drop_resp

  # fallback的secondary服务器
  - tag: remote_sequence
    type: sequence
    args:
      - exec: $clash_forward
      - exec: query_summary "HIT_FAKEIP"
      - exec: accept

  # fallback sequence
  - tag: fallback
    type: fallback
    args:
      primary: local_sequence
      secondary: remote_sequence
      threshold: 400
      always_standby: false

  ################## 主运行逻辑 ##################

  - tag: main_sequence
    type: sequence
    args:

      - matches: 
          - qname $geosite_cn
        exec: $local_forward
      - matches: has_resp
        exec: accept

      - matches: 
          - qname $geosite_no_cn
        exec: $clash_forward
      - matches: has_resp
        exec: accept

      - exec: $fallback

  ################## 入口服务 ##################
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: :6353
